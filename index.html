<!DOCTYPE html>
<html>
<head>
  <title>good morning</title>
<script data-goatcounter="https://arnasmat.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
<script>
    fetch('https://arnasmat.goatcounter.com/counter/' + encodeURIComponent(location.pathname) + '.json')
      .then(r => r.ok ? r.json() : null)
      .then(d => {
        if (!d) return;
        const el = document.createElement('div');
        el.style.cssText = 'margin-top:3rem;font-size:.85rem;color:#888;';
        el.textContent = '👁 peržiūros: ' + d.count;
        document.body.appendChild(el);
      })
      .catch(() => {});
</script>
</head>
<body>
  <p>good morning</p>
</body>
</html>
